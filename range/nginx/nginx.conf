# nginx reverse proxy for the Kestrel Pay range.
# Access log is a network-tier telemetry source (parsed in Phase 3).
worker_processes 1;
events { worker_connections 256; }
http {
  log_format kestrel '$remote_addr - [$time_iso8601] "$request" $status '
                     '$body_bytes_sent "$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log kestrel;
  # Lab rate-limit (baseline control; abuse scenario shows it is insufficient alone).
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  upstream kestrel_api { server kestrel-api:8080; }
  server {
    listen 80;
    location / {
      limit_req zone=api burst=40 nodelay;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $host;
      proxy_pass http://kestrel_api;
    }
  }
}
