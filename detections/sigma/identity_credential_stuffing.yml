title: Credential Stuffing / Brute Force
id: KP-0041
status: experimental
description: A high volume of failed logins from a single source in a short window - automated credential stuffing against the login endpoint.
references:
  - https://attack.mitre.org/techniques/T1110/
author: Project KESTREL
date: 2026/09/06
logsource:
  service: kestrel-api
detection:
  selection:
    event_type: login_failure
  condition: selection
aggregation:
  group_by: src_ip
  timespan: 5m
  threshold: 10
fields: [actor, src_ip]
falsepositives:
  - A misconfigured client retrying (allow-list + alert lower for known service IPs)
level: medium
tags:
  - attack.t1110
  - attack.credential_access
