title: Secret Detected in Commit / CI
id: KP-0060
status: experimental
description: A credential/secret was detected in source or CI (e.g., gitleaks hit) - a leaked key that could reach all customers if shipped.
author: Project KESTREL
date: 2026/09/07
logsource:
  service: cicd
detection:
  selection:
    event_type: secret_scan_hit
  condition: selection
fields: [actor, details]
falsepositives:
  - Documented lab decoys (allow-listed in .gitleaks.toml)
level: high
tags:
  - attack.t1552
  - attack.credential_access
