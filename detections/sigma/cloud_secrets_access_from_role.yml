title: Secrets Manager Access by Assumed Role
id: KP-0030
status: experimental
description: GetSecretValue called by an assumed-role session - watch for the API task role reading production payment-signing secrets, a key crown-jewel access path.
author: Project KESTREL
date: 2026/09/06
logsource:
  service: cloudtrail
detection:
  selection:
    event_type: GetSecretValue
    actor|contains: 'assumed-role'
  condition: selection
fields: [actor, src_ip, details]
falsepositives:
  - The task role legitimately reading its own runtime secret (scope by secretId + source IP)
level: high
tags:
  - attack.t1552.001
  - attack.credential_access
